spring.application.name=skillswap

# MySQL Database
# createDatabaseIfNotExist=true -> MySQL creates skillswap_db on first connect
# allowPublicKeyRetrieval=true  -> needed by MySQL 8 password login when useSSL=false (local dev only)
spring.datasource.url=jdbc:mysql://localhost:3306/skillswap_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
# ${NAME:default} reads an environment variable; the value after ':' is used if it is not set
spring.datasource.username=${DB_USERNAME:root}
# No default on purpose: the password must come from the DB_PASSWORD environment variable
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=8080
