spring.application.name=skillswap

# MySQL 8.4 (Windows service MySQL84) on port 3306
# allowPublicKeyRetrieval=true -> needed for MySQL 8.4 password login when useSSL=false (local dev only)
spring.datasource.url=jdbc:mysql://localhost:3306/skillswap_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
# The password is read from the DB_PASSWORD environment variable, never written here.
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=8080
