# Used ONLY when running tests (src/test/resources overrides src/main/resources).
# Tests get their own database so they never touch the real skillswap_db data.
spring.application.name=skillswap-test

spring.datasource.url=jdbc:mysql://localhost:3306/skillswap_test_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# create-drop: build fresh tables when tests start, drop them when tests finish.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
